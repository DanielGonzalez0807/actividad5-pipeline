<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividad 5 · CI/CD con AWS CodePipeline</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0;
           min-height: 100vh; display: grid; place-items: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 40px; max-width: 560px; width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    h1 { margin-top: 0; color: #38bdf8; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
    dt { color: #94a3b8; }
    dd { margin: 0; font-family: ui-monospace, monospace; }
    .ok { color: #4ade80; }
    footer { margin-top: 24px; font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="mensaje">Hola desde AWS CodePipeline</h1>
    <p>Esta página se despliega sola cada vez que hago <code>git push</code> a la rama <code>main</code>.</p>
    <dl>
      <dt>Versión</dt><dd id="version">…</dd>
      <dt>Commit</dt><dd id="commit">…</dd>
      <dt>Build</dt><dd id="build">…</dd>
      <dt>Fecha del build</dt><dd id="fecha">…</dd>
      <dt>Estado</dt><dd id="estado">…</dd>
    </dl>
    <footer>Herramientas de Software II · Universidad de La Salle · Daniel González Ortiz</footer>
  </main>
  <script>
    fetch('/api/info').then(r => r.json()).then(info => {
      document.getElementById('mensaje').textContent = info.mensaje;
      document.getElementById('version').textContent = info.version;
      document.getElementById('commit').textContent = String(info.commit).slice(0, 7);
      document.getElementById('build').textContent = info.buildId;
      document.getElementById('fecha').textContent = info.fechaBuild || '—';
    });
    fetch('/health').then(r => r.json()).then(h => {
      const el = document.getElementById('estado');
      el.textContent = h.estado; el.className = 'ok';
    });
  </script>
</body>
</html>
